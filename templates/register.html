<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Register Phone</title>
<link rel="stylesheet" href="/static/style.css"></head><body>
<nav><a href="/">Home</a><a href="/register">Register Phone</a><a href="/search">Search</a></nav>
<h1>Register a Phone (from receipt)</h1>
<form method="post" action="/register" class="card">
<h3>Device Details</h3>
<div class="grid">
<label>IMEI (15 digits)*<input name="imei" required maxlength="15"></label>
<label>Serial Number<input name="serial_number"></label>
<label>Brand<input name="brand" placeholder="Apple, Samsung, etc."></label>
<label>Model<input name="model"></label>
<label>Color<input name="color"></label>
<label>Storage<input name="storage" placeholder="128GB"></label>
</div>
<h3>Receipt / Purchase Details</h3>
<div class="grid">
<label>Purchase Date<input name="purchase_date" type="date"></label>
<label>Store Name<input name="store_name"></label>
<label>Store Location<input name="store_location"></label>
<label>Price<input name="price"></label>
<label>Receipt Number<input name="receipt_number"></label>
<label>Warranty Expiry<input name="warranty_expiry" type="date"></label>
</div>
<h3>Owner Details</h3>
<div class="grid">
<label>Owner Name<input name="owner_name"></label>
<label>Owner Phone<input name="owner_phone"></label>
<label>Owner Email<input name="owner_email" type="email"></label>
</div>
<label>Notes<textarea name="notes" rows="3"></textarea></label>
<button type="submit">Register Phone</button>
</form>
</body></html>
