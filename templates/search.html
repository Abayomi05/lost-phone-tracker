<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Search Phone</title></head><body>
<nav><a href="/">Home</a><a href="/register">Register Phone</a><a href="/search">Search</a></nav>
<h1>Search by IMEI / Serial / Receipt Number</h1>
<div class="card">
<form method="post" action="/search">
<input name="query" placeholder="Enter IMEI, serial number, or receipt number" required>
<button type="submit">Search</button>
</form>
{% if not_found %}<p style="color:red">No phone found for "{{query}}".</p>{% endif %}
</div>
</body></html>
