<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Lost Phone Tracker</title>
<style>body{font-family:Arial,sans-serif;max-width:900px;margin:0 auto;padding:20px;background:#f5f5f5}
.card{background:#fff;padding:20px;margin:15px 0;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
input,select,textarea{width:100%;padding:8px;margin:6px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:4px}
button{background:#007bff;color:#fff;padding:10px 20px;border:none;border-radius:4px;cursor:pointer;font-size:16px}
button:hover{background:#0056b3}
.status{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:bold}
.registered{background:#e0e0e0;color:#333}.lost{background:#f8d7da;color:#721c24}.found{background:#d4edda;color:#155724}.recovered{background:#cce5ff;color:#004085}
nav a{margin-right:15px;text-decoration:none;color:#007bff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style></head><body>
<nav><a href="/">Home</a><a href="/register">Register Phone</a><a href="/search">Search</a><a href="/status/lost">Lost</a><a href="/status/found">Found</a></nav>
<h1>Lost Phone Tracker</h1>
<div class="card">
<h2>Recently Registered</h2>
{% for p in phones %}
<div style="border-bottom:1px solid #eee;padding:8px 0">
<a href="/phone/{{p.id}}"><strong>{{p.brand}} {{p.model}}</strong></a> — IMEI: {{p.imei}}
<span class="status {{p.status}}">{{p.status}}</span>
</div>
{% else %}<p>No phones registered yet.</p>{% endfor %}
</div>
</body></html>
