services:
  - type: web
    name: lost-phone-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lost-phone-db
          property: connectionString
databases:
  - name: lost-phone-db
    plan: free
    databaseName: lostphones
    user: lostphones
